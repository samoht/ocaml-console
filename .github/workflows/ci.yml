name: CI

on:
  push:
    branches: [main]
  pull_request:

# The tape examples need vhs, which is not in opam-repository yet. Pinning it
# from its repository lets every job build them and check the tapes.
env:
  VHS_PIN: https://github.com/samoht/ocaml-vhs.git#main

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ['5.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam pin add -n vhs "$VHS_PIN"
      - run: opam install . vhs --deps-only --with-test
      - run: opam install vhs
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  lower-bounds:
    name: Lower bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      # matrix needs OCaml 5.4, so the compiler is not the bound under test here.
      # Resolve every dependency to the oldest version its lower bound allows,
      # so a call that only compiles against a newer API fails here rather than
      # in a downstream opam build.
      - run: opam pin add -n vhs "$VHS_PIN"
      - run: opam install . vhs --deps-only --with-test --criteria="+count[version-lag,solution]"
      - run: opam install vhs
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  lint-fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - uses: ocaml/setup-ocaml/lint-fmt@v3

  # merlint is not on opam yet and comes from a private overlay, so this job
  # reports without blocking until merlint is released.
  merlint:
    name: Lint (merlint)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam repo add samoht https://tangled.org/gazagnaire.org/opam-overlay.git
      - run: opam pin add -n vhs "$VHS_PIN"
      - run: opam install . vhs --deps-only --with-test
      - run: opam install vhs merlint
      - run: opam exec -- merlint --build
