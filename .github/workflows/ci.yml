name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ['5.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only
      - run: opam exec -- dune build -p console,console-eio @install

  lower-bounds:
    name: Lower bounds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      # matrix needs OCaml 5.4, so the compiler is not the bound under test here.
      # Resolve every dependency to the oldest version its lower bound allows,
      # so a call that only compiles against a newer API fails here rather than
      # in a downstream opam build.
      - run: opam install . --deps-only --with-test --criteria="+count[version-lag,solution]"
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  # odoc cannot resolve references to the modules of other libraries, such as
  # Fmt.stderr, in console's documentation: those warnings are expected. Any
  # other warning is a reference of console's own that is broken.
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only --with-doc
      - run: opam install odoc
      - run: opam exec -- dune build @doc 2> doc.log
      - run: |
          if grep '^Warning' doc.log \
            | grep -v -E 'unresolvedroot\((Fmt|Format|Logs|Sys|Invalid_argument)\)'
          then
            cat doc.log
            exit 1
          fi

  lint-fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - uses: ocaml/setup-ocaml/lint-fmt@v3

  # merlint is not on opam yet, so this job reports without blocking until
  # merlint is released.
  #
  # merlint comes as a released binary, apart from the project's
  # dependencies. It depends on console: built from source beside this
  # checkout, it is built against the console under test, and a change to
  # console's API breaks merlint's build before it lints anything. The bottle
  # links the console it was released with. Locally, `brew install
  # samoht/monopam/merlint` then `opam exec -- merlint --build` run the same
  # check.
  #
  # merlint reads the .cmt files dune writes here, which a merlint built with
  # another OCaml minor version cannot load: it then skips the rules that need
  # types and exits 3. The bottles are built with OCaml 5.4, so the compiler
  # below moves with them.
  merlint:
    name: Lint (merlint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only --with-test

      # Homebrew is on the Linux runners but not on their PATH. Without a
      # bottle for this runner brew would build merlint from source, which is
      # what this job avoids, so a missing bottle stops it here.
      - run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap samoht/monopam
          brew info --json=v2 samoht/monopam/merlint \
            | jq -e '.formulae[0].bottle.stable.files.x86_64_linux' > /dev/null \
            || { echo "::error::no x86_64_linux bottle of merlint in samoht/monopam"; exit 1; }
          brew install samoht/monopam/merlint
      - run: opam exec -- /home/linuxbrew/.linuxbrew/bin/merlint --build
