name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ['5.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only
      - run: opam exec -- dune build -p console,console-eio @install

  lower-bounds:
    name: Lower bounds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      # matrix needs OCaml 5.4, so the compiler is not the bound under test here.
      # Resolve every dependency to the oldest version its lower bound allows,
      # so a call that only compiles against a newer API fails here rather than
      # in a downstream opam build.
      - run: opam install . --deps-only --with-test --criteria="+count[version-lag,solution]"
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  # odoc cannot resolve references to the modules of other libraries, such as
  # Fmt.stderr, in console's documentation: those warnings are expected. Any
  # other warning is a reference of console's own that is broken.
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only --with-doc
      - run: opam install odoc
      - run: opam exec -- dune build @doc 2> doc.log
      - run: |
          if grep '^Warning' doc.log \
            | grep -v -E 'unresolvedroot\((Fmt|Format|Logs|Sys|Invalid_argument)\)'
          then
            cat doc.log
            exit 1
          fi

  lint-fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - uses: ocaml/setup-ocaml/lint-fmt@v3

  # merlint is not on opam yet, so it and its dependencies come from the tangled
  # overlay and this job reports without blocking until merlint is released. The
  # checkout is not pinned: merlint builds against the overlay's console.
  merlint:
    name: Lint (merlint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'
          opam-pin: false

      - run: opam repo add samoht https://tangled.org/gazagnaire.org/opam-overlay.git
      # The overlay's eio-fs needs the eio commit the overlay carries, but that
      # package's version sorts below the eio >= 1.6 eio-fs asks for. Remove this
      # when the overlay's eio has a version that sorts above 1.6.
      - run: |
          for p in eio eio_linux eio_posix eio_main; do
            opam pin add -n $p.1.6 https://github.com/ocaml-multicore/eio.git#1fa776212551d717dfa19041328cceda1db97797
          done
      - run: opam install . --deps-only --with-test
      - run: opam install merlint
      - run: opam exec -- merlint --build
