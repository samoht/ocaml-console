name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# merlint is pinned at one commit, so that the lint job checks every commit
# with the same merlint.
# The tape examples need k7, which is not in opam-repository yet. Pinning it
# from its repository, at one commit, lets every job build them and check the
# tapes against the same k7. At release the pin moves to the k7 0.9.0 tag.
env:
  MERLINT_PIN: https://github.com/samoht/merlint.git#109b871c4b4c5dc3a97e9e7ce757f7d3052ea4be
  K7_PIN: https://github.com/samoht/ocaml-k7.git#c55bb151687e9d5cf946b996b50d2d4e4ef97a93

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ['5.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam pin add -n k7 "$K7_PIN"
      - run: opam install . k7 --deps-only --with-test
      - run: opam install k7
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  lower-bounds:
    name: Lower bounds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      # matrix needs OCaml 5.4, so the compiler is not the bound under test here.
      # Resolve every dependency to the oldest version its lower bound allows,
      # so a call that only compiles against a newer API fails here rather than
      # in a downstream opam build.
      - run: opam pin add -n k7 "$K7_PIN"
      - run: opam install . k7 --deps-only --with-test --criteria="+count[version-lag,solution]"
      - run: opam install k7
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  lint-fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - uses: ocaml/setup-ocaml/lint-fmt@v3

  # merlint is not on opam yet and its dependencies come from a private
  # overlay, so this job reports without blocking until merlint is released.
  merlint:
    name: Lint (merlint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam repo add samoht https://tangled.org/gazagnaire.org/opam-overlay.git
      - run: opam pin add -n k7 "$K7_PIN"
      - run: opam pin add -n merlint "$MERLINT_PIN"
      - run: opam install . k7 --deps-only --with-test
      - run: opam install k7 merlint
      - run: opam exec -- merlint --build
