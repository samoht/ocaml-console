name: Fuzz

# Every build runs each property for 0.3 s, which keeps pull requests fast
# and finds only what is common. Once a night the properties run for longer,
# and AFL explores from the corpus they generate. The timeout of an input,
# 120 s, guards against a hang only: no verdict depends on a machine's pace.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties:
    name: Properties, 20 s each
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build ./fuzz/fuzz.exe
      - run: ./_build/default/fuzz/fuzz.exe --budget 20 --timeout 120

  afl:
    name: AFL, 30 min
    runs-on: ubuntu-latest
    env:
      AFL_SKIP_CPUFREQ: 1
      AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: 1
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y afl++

      # A compiler with AFL instrumentation, which the afl profile of
      # fuzz/dune expects.
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 'ocaml-variants.5.4.0+options,ocaml-option-afl'

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build ./fuzz/fuzz.exe --profile=afl

      # The fuzz alias runs AFL for a minute; the night has more time.
      - name: Run AFL
        run: |
          cd "$RUNNER_TEMP"
          fuzz="$GITHUB_WORKSPACE/_build/default/fuzz/fuzz.exe"
          "$fuzz" --gen-corpus corpus
          afl-fuzz -V 1800 -i corpus -o findings -- "$fuzz" @@

      - name: Fail on a crash
        run: |
          crashes="$RUNNER_TEMP/findings/default/crashes"
          if ls "$crashes" 2>/dev/null | grep -qv README; then
            ls -l "$crashes"
            exit 1
          fi

      # AFL names its findings with colons, which an artifact refuses.
      - name: Archive the findings
        if: always()
        run: tar -czf "$RUNNER_TEMP/afl-findings.tar.gz" -C "$RUNNER_TEMP" findings

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afl-findings
          path: ${{ runner.temp }}/afl-findings.tar.gz
